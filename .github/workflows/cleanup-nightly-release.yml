name: Remove accidental nightly release

on:
  push:
    branches:
      - codex/merge-upstream-rc40

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete nightly GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'nightly-merge-upstream-rc40-20260928';
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              core.info(`Deleted release ${release.id} for ${tag}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`No release found for ${tag}`);
              } else {
                throw error;
              }
            }
